{% extends 'base.html' %}

{% block title %}My Profile - Fleet & Asset Tracking{% endblock %}

{% block content %}
<div class="page-title">
    <h1><i class="fas fa-user"></i> My Profile</h1>
</div>

<div class="card">
    <div class="card-body">
        <dl class="row">
            <dt class="col-sm-3">Name</dt>
            <dd class="col-sm-9">{{ user.get_full_name }}</dd>

            <dt class="col-sm-3">Email</dt>
            <dd class="col-sm-9">{{ user.email }}</dd>

            <dt class="col-sm-3">Role</dt>
            <dd class="col-sm-9">{{ user.get_role_display }}</dd>

            <dt class="col-sm-3">Joined</dt>
            <dd class="col-sm-9">{{ user.date_joined|date:'M d, Y' }}</dd>
        </dl>
        <a href="{% url 'accounts:profile_update' %}" class="btn btn-primary">
            <i class="fas fa-edit"></i> Edit Profile
        </a>
    </div>
</div>
