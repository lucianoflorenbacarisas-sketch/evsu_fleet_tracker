{% extends 'base.html' %}

{% block title %}Delete Asset - Fleet & Asset Tracking{% endblock %}

{% block content %}
<div class="page-title">
    <h1><i class="fas fa-trash"></i> Delete Asset</h1>
</div>

<div class="card">
    <div class="card-body">
        <p>Are you sure you want to delete the asset <strong>{{ object.name }}</strong> ({{ object.asset_code }})?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="fas fa-check"></i> Confirm Delete
            </button>
            <a href="{% url 'core:asset_detail' object.id %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
